<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40">
  <!-- Background -->
  <rect width="160" height="40" fill="none"/>
  
  <!-- Main Logo Group -->
  <g transform="translate(20, 20)">
    <!-- Circle with blue border -->
    <circle
      cx="0"
      cy="0"
      r="18"
      fill="#1a1b26"
      stroke="#4B56D2"
      stroke-width="1.5"/>
    
    <!-- Simplified Camera Icon with centered lens -->
    <g transform="translate(-9, -6.5) scale(0.45)">
      <!-- Camera Body -->
      <path d="M0,0 h40 v30 h-40z" fill="#4B56D2"/>
      <!-- Top Handle -->
      <path d="M15,-8 h10 v8 h-10z" fill="#4B56D2"/>
      <!-- Flash -->
      <path d="M28,-5 h8 v5 h-8z" fill="#4B56D2"/>
      <!-- Centered Lens -->
      <circle cx="20" cy="15" r="8" fill="#1a1b26"/>
      <circle cx="20" cy="15" r="4" fill="#4B56D2"/>
    </g>
  </g>
  
  <!-- Company Name -->
  <text
    x="100"
    y="24"
    font-family="Arial"
    font-size="16"
    font-weight="900"
    text-anchor="middle"
    fill="#FFFFFF">
    FILMSNATION
  </text>
</svg>