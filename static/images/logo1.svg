<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40">
  <!-- Background - transparent -->
  <rect width="200" height="40" fill="none"/>
  <!-- Main Logo Group - position unchanged -->
  <g transform="translate(20, 20)">
    <!-- Circle with purple background - made bigger -->
    <circle
      cx="0"
      cy="0"
      r="19"
      fill="#4B56D2"
      stroke="#6C72D4"
      stroke-width="1.5"/>
    <!-- Camera Icon -->
    <g transform="translate(-9, -7.5) scale(0.5)">
      <!-- Main Camera Body -->
      <rect x="0" y="0" width="40" height="30" rx="4" fill="#F8F7FE"/>
      <!-- Lens -->
      <circle cx="20" cy="15" r="10" fill="#4B56D2" stroke="#F8F7FE" stroke-width="1.5"/>
      <circle cx="20" cy="15" r="6" fill="#F8F7FE"/>
      <!-- Top Handle -->
      <rect x="12" y="-6" width="16" height="6" rx="2" fill="#F8F7FE"/>
      <!-- Flash -->
      <rect x="30" y="-4" width="6" height="4" rx="1" fill="#F8F7FE"/>
      <!-- Film Reel -->
      <circle cx="-6" cy="15" r="8" fill="#F8F7FE"/>
      <circle cx="-6" cy="15" r="3" fill="#4B56D2"/>
      <circle cx="-6" cy="15" r="1" fill="#F8F7FE"/>
    </g>
  </g>
  <!-- Company Name - moved left -->
  <text
    x="100"
    y="22"
    font-family="Arial, sans-serif"
    font-size="16"
    font-weight="500"
    text-anchor="middle"
    alignment-baseline="middle"
    fill="#F8F7FE">
    FILMSNATION
  </text>
</svg>