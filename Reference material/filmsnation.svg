<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="1200" height="800" fill="#0F0F1A"/>
    
    <!-- Logo Container -->
    <g transform="translate(600, 400)">
        <!-- Play Button Circle -->
        <circle 
            cx="0" 
            cy="0" 
            r="120" 
            fill="#1A1A2E"
            stroke="#4B56D2"
            stroke-width="4"/>
        
        <!-- Play Triangle -->
        <path 
            d="M-30,-50 L50,0 L-30,50 Z" 
            fill="#4B56D2"/>
        
        <!-- Company Name -->
        <text 
            x="0" 
            y="180" 
            font-family="Arial Black, Arial, sans-serif" 
            font-size="64" 
            font-weight="bold" 
            text-anchor="middle" 
            fill="#FFFFFF">
            FILMSNATION
        </text>
        
        <!-- Tagline -->
        <text 
            x="0" 
            y="230" 
            font-family="Arial, sans-serif" 
            font-size="24" 
            text-anchor="middle" 
            fill="#8D8DAA">
            Stream Beyond Boundaries
        </text>
    </g>
</svg>