<!-- Video.js CSS -->
<link href="https://vjs.zencdn.net/8.16.1/video-js.css" rel="stylesheet" />

<style>
.video-player-container {
  width: 100%;
  max-width: 640px;
  margin: 20px auto;
  background: #f0f0f0;
  padding: 10px;
}

.video-wrapper {
  position: relative;
  width: 100%;
  background: #000;
  overflow: hidden;
}

/* Base video player styles */
.video-js {
  width: 100% !important;
  height: 0 !important;
  padding-bottom: 56.25% !important; /* 16:9 Aspect Ratio */
}

/* Vertical video container adjustments */
.video-wrapper.vertical {
  max-width: 360px;
  margin: 0 auto;
}

.video-js.vertical-video {
  padding-bottom: 177.78% !important; /* 9:16 Aspect Ratio */
}

/* Critical fix for video element */
.video-js video,
.video-js .vjs-tech {
  position: absolute;
  top: 0;
  left: 0;
  width: 100% !important;
  height: 100% !important;
  object-fit: contain !important;
  background: #000;
}

/* Ensure controls stay visible */
.video-js .vjs-control-bar {
  position: absolute;
  bottom: 0;
  width: 100%;
}

@media (max-width: 768px) {
  .video-player-container {
    padding: 5px;
  }
  
  .video-wrapper.vertical {
    width: 100%;
    max-width: 360px;
  }
}
</style>

<!-- Video Player Component -->
<div class="video-player-container">
  {% if video and video.file %}
    <div class="video-wrapper" id="wrapper-{{ video.id }}">
      <video
        id="my-video-{{ video.id }}"
        class="video-js vjs-big-play-centered"
        controls
        preload="metadata"
        poster="{{ video.thumbnail.url|default:'' }}"
        data-setup='{
          "controls": true,
          "autoplay": false,
          "preload": "metadata",
          "fluid": false
        }'
      >
        <source src="{{ video.file.url }}" type="video/mp4" />
        <p class="vjs-no-js">
          To view this video please enable JavaScript, and consider upgrading to a
          web browser that supports HTML5 video
        </p>
      </video>
    </div>
  {% else %}
    <p>Video data not available</p>
  {% endif %}
</div>

<!-- Video.js Script -->
<script src="https://vjs.zencdn.net/8.16.1/video.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const players = document.querySelectorAll('.video-js');
    
    players.forEach(player => {
        if (player) {
            // Initialize the player
            const vjsPlayer = videojs(player.id, {
                controls: true,
                fluid: false,
                preload: 'metadata'
            });

            // Handle video metadata load
            vjsPlayer.on('loadedmetadata', function() {
                const videoElement = this.tech().el();
                const wrapper = document.getElementById('wrapper-' + player.id.split('-')[2]);
                
                // Check if video is vertical
                if (videoElement.videoHeight > videoElement.videoWidth) {
                    player.classList.add('vertical-video');
                    wrapper.classList.add('vertical');
                }
            });
        }
    });
});
</script>
