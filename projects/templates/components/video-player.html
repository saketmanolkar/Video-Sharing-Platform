{% load static %}

<!-- Video.js CSS -->
<link href="https://vjs.zencdn.net/8.16.1/video-js.css" rel="stylesheet" />  

<!-- Debug Info
<div style="display: none;" id="debug-info">
    <pre>
    Video ID: {{ video.id }}
    Processing Status: {{ video.processing_status }}
    Has Encoded Versions: {{ video.encoded_versions|yesno:"Yes,No" }}
    Encoded Versions: {{ video.encoded_versions|json_script:"encoded-versions" }}
    File Path: {{ video.file }}
    </pre>
</div>  -->

<!-- Video Player Component -->
<div class="video-player-container">
  {% if video %}
    <div class="video-wrapper" id="wrapper-{{ video.id }}">
      {% if not video.encoded_versions %}
        <div class="processing-overlay">
            <div class="processing-content">
                <div class="loader">
                    <div class="circle"></div>
                    <div class="circle"></div>
                    <div class="circle"></div>
                    <div class="circle"></div> 
                </div>
                <h3 style="text-align: center;">🎬 Processing Video</h3>
                <p>Please wait while we process your video for the best quality!</p>
                <div style="display: flex; justify-content: center; width: 100%;">
                  <button onclick="window.location.reload()" class="refresh-btn" style="margin: 20px auto;">
                    <i class="fas fa-sync-alt"></i> Check Processing Status
                  </button>
                </div>
            </div>
        </div>
      {% else %}
        <video 
            id="video-js-player" 
            class="video-js vjs-big-play-centered vjs-theme-forest" 
            controls 
            preload="auto" 
            poster="{% if video.thumbnail %}{{ video.thumbnail.url }}{% else %}{% static 'images/default.jpg' %}{% endif %}"
            width="100%"
            height="auto">
            <!-- Only show video if encoding is complete -->
            <source src="{% url 'api-stream-video' video.id %}" type="video/mp4">
            Your browser does not support the video tag.
        </video>
      {% endif %}
    </div>
  {% endif %}
</div>

<!-- Video.js Script -->
<script src="https://vjs.zencdn.net/8.16.1/video.min.js"></script>

<!-- Add Event Tracking Plugin -->
<script src="https://cdn.jsdelivr.net/npm/videojs-event-tracking/dist/videojs-event-tracking.min.js"></script>

<!-- Pass Django variables to JavaScript -->
<script>
    window.videoPlayerData = {
        windowId: "{{ view_history.window_id|escapejs }}",
        username: "{{ request.user.username|default:'Anonymous'|escapejs }}",
        videoId: "{{ video.id|escapejs }}",
        isAuthenticated: "{% if request.user.is_authenticated %}true{% else %}false{% endif %}",
        userId: "{{ request.user.id }}"
    };
</script>

<script src="{% static 'js/video_player.js' %}"></script> 

{% csrf_token %}
