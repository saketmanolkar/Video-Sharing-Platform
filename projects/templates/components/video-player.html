<!-- Video.js CSS -->
<link href="https://vjs.zencdn.net/8.16.1/video-js.css" rel="stylesheet" />
<style>
.video-player-container {
  width: 100%;
  max-width: 640px;
  margin: 20px auto;
  background: #f0f0f0;
  padding: 10px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.video-wrapper {
  position: relative;
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* Single video style for all videos */
.video-js {
  width: 640px;
  height: 360px;
}

@media (max-width: 768px) {
  .video-js {
    width: 100%;
    max-width: 640px;
    height: auto;
  }
}
</style>

<!-- Video Player Component -->
<div class="video-player-container">
  {% if video and video.file %}
    <div class="video-wrapper">
      <video
        id="my-video-{{ video.id }}"
        class="video-js vjs-big-play-centered"
        controls
        preload="metadata"
        poster="{{ video.thumbnail.url|default:'' }}"
        data-setup='{
          "controls": true,
          "autoplay": false,
          "preload": "metadata",
          "fluid": true
        }'
      >
        <source src="{{ video.file.url }}" type="video/mp4" />
        <p class="vjs-no-js">
          To view this video please enable JavaScript, and consider upgrading to a
          web browser that supports HTML5 video
        </p>
      </video>
    </div>
  {% else %}
    <p>Video data not available</p>
  {% endif %}
</div>

<!-- Video.js Script -->
<script src="https://vjs.zencdn.net/8.16.1/video.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const players = document.querySelectorAll('.video-js');
    players.forEach(player => {
        if (player) {
            videojs(player.id, {
                controls: true,
                fluid: false,
                preload: 'metadata',
                responsive: true,
                aspectRatio: '16:9'
            });
        }
    });
});
</script>
