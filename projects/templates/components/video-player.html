{% load static %}

<!-- Video.js CSS -->
<link href="https://vjs.zencdn.net/8.16.1/video-js.css" rel="stylesheet" />

<style>
.video-player-container {
    width: 100%;
    max-width: 850px;
    margin: 20px auto 10px;
    background: #000;
    border-radius: 0.7rem;
    overflow: hidden;
    aspect-ratio: 16/9;
}

.video-wrapper {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #000;
}

.video-js {
    width: 100% !important;
    height: 100% !important;
    background-color: #000;
}

.video-js .vjs-tech {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: contain !important;
}

.video-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px;  /* Make padding equal on both sides */
}

.video-section {
    width: 100%;
    margin-bottom: 10px;
    display: flex;          /* Add these lines */
    justify-content: center;  /* to center the video player */
    align-items: center;      /* vertically center as well */
}

/* Add this new style for the video player itself */
.video-player {
    width: 100%;
    max-width: 1000px;  /* or whatever maximum width you prefer */
    margin: 0 auto;     /* center horizontally */
    aspect-ratio: 16/9; /* maintain video aspect ratio */
    background: #000;   /* black background for letterboxing */
    border-radius: 8px; /* optional: rounded corners */
    overflow: hidden;   /* keep video within bounds */
}

.video-js .vjs-poster {
    background-size: cover;
    background-position: center center;
}
</style>

<!-- Video Player Component -->
<div class="video-player-container">
  {% if video %}
    <div class="video-wrapper" id="wrapper-{{ video.id }}">
      <video
        id="my-video-{{ video.id }}"
        class="video-js vjs-big-play-centered"
        controls
        preload="metadata"
        poster="{% if video.thumbnail %}{{ video.thumbnail.url }}{% else %}{% static 'images/default.jpg' %}{% endif %}"
        data-setup='{
            "controls": true,
            "autoplay": false,
            "preload": "metadata",
            "responsive": true,
            "fluid": false
        }'
      >
        <source src="{% url 'stream-video' video.id %}" type="video/mp4" />
      </video>
    </div>
  {% endif %}
</div>

<!-- Video.js Script -->
<script src="https://vjs.zencdn.net/8.16.1/video.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const players = document.querySelectorAll('.video-js');
    
    players.forEach(player => {
        if (player) {
            videojs(player.id);
        }
    });
});
</script>
