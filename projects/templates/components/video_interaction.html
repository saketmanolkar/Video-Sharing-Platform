<div class="interaction-buttons">
    {% if is_authenticated and is_not_uploader %}
    <div class="interaction-group">
        <button class="interaction-btn follow-btn {% if is_following %}active{% endif %}" 
                data-profile-id="{{ uploader_profile_id }}" 
                data-action="follow">
            <i class="fas {% if is_following %}fa-user-minus{% else %}fa-user-plus{% endif %}"></i>
            <span class="follow-text">{% if is_following %}Following{% else %}Follow{% endif %}</span>
        </button>
    </div>
    {% endif %}
    <div class="interaction-group">
        <span class="stats-count large">{{ video.views }}</span>
        <span class="view-label">Views</span>
    </div>
    
    <div class="interaction-group">
        <button class="interaction-btn api-like-btn {% if user_like and user_like.is_like %}active{% endif %}" 
                data-video-id="{{ video.id }}" 
                data-action="like">
            <i class="fas fa-thumbs-up"></i>
        </button>
        <span class="stats-count large">{{ likes_count }}</span>
    </div>
    
    <div class="interaction-group">
        <button class="interaction-btn api-dislike-btn {% if user_like and user_like.is_like == False %}active{% endif %}" 
                data-video-id="{{ video.id }}" 
                data-action="dislike">
            <i class="fas fa-thumbs-down"></i>
        </button>
        <span class="stats-count large">{{ dislikes_count }}</span>
    </div>
</div>
