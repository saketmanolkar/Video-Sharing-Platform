{% load static %}

<div class="grid grid--three">
  {% for video in videos %}
    <div class="column">
      <div class="card project">
        <a href="{% url 'project' video.id %}" class="project">
          <div class="project__thumbnail-wrapper">
            <img class="project__thumbnail" 
                 src="{% if video.thumbnail %}{{ video.thumbnail.url }}{% else %}{% static 'images/default.jpg' %}{% endif %}"
                 alt="{{ video.title }}" />
          </div>
          <div class="card__body">
            <h3 class="project__title" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ video.title }}</h3>
            <div class="project__info" style="margin-top: -8px;">
              <a class="project__author" href="{% url 'profile' video.uploader.profile.id %}">{{video.uploader.username}}</a>
              <span class="separator"></span>
              <p class="project--rating" style="margin-top: 15px;">
                  <span class="views-number" style="font-weight: bold;">{{ video.views }}</span> 
                  <span class="views-label">Views</span> • 
                  <span class="date-number" style="font-weight: bold;">{{ video.created_at|date:"M Y" }}</span>
              </p>
            </div>
            <div class="project__tags" style="margin-top: -10px;">
              {% for tag in video.tags.all %}
              <span class="tag tag--pill">{{ tag.name }}</span>
              {% endfor %}
            </div>
          </div>
        </a>
      </div>
    </div>
    {% empty %}
    <p class="no-videos-message">No videos found</p>
  {% endfor %}
</div>
