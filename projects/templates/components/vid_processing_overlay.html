<div id="processingOverlay" class="video-processing-overlay" style="display: none;">
    <div class="video-processing-overlay__content">
        <!-- Processing State -->
        <div id="processingState">
            <h3 class="processing-title">Processing Video</h3>
            <p class="processing-subtitle">Please wait while we encode and compress your video...</p>
            <div class="spinner"></div>
        </div>

        <!-- Error State -->
        <div id="errorState" style="display: none;">
            <div class="error-icon">❌</div>
            <h3 class="processing-title">Upload Failed</h3>
            <p class="processing-subtitle" id="errorMessage">An error occurred during processing.</p>
            <button class="retry-button" onclick="window.location.reload()">Try Again</button>
        </div>
    </div>
</div>



<script>
function showError(message) {
    document.getElementById('processingState').style.display = 'none';
    document.getElementById('errorState').style.display = 'block';
    if (message) {
        document.getElementById('errorMessage').textContent = message;
    }
}

function showProcessing() {
    document.getElementById('processingState').style.display = 'block';
    document.getElementById('errorState').style.display = 'none';
}
function hideOverlay() {
    const overlay = document.getElementById('processingOverlay');
    overlay.classList.add('video-processing-overlay--hidden');
}
</script>
