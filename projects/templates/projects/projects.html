{% extends 'main.html' %}
{% load static %}
{% block content %}
    <main class="projects">
        <section class="hero-section text-center">
          <div class="container container--narrow">
            <div class="hero-section__box">
              <h2>Search for <span>Videos</span></h2>
            </div>
    
            <div class="hero-section__search">
                <form class="form" action="{% url 'projects' %}" method="get">
                    <div class="form__field">
                        <input 
                            class="input input--text" 
                            id="formInput#search" 
                            type="text" 
                            name="search"
                            placeholder="Search by title, description, tags, or username" 
                            value="{{ search_query }}"
                        />
                    </div>
                    <input class="btn btn--sub btn--lg" type="submit" value="Search" />
                </form>
            </div>
          </div>
        </section>
        <br>
        <!-- Search Result: DevList -->
        <section class="projectsList">
          <div class="container">
            {% include 'components/video_grid.html' with videos=videos %}
          </div>
        </section>
    
       {% include 'pagination.html' with queryset=videos custom_range=custom_range %}
  
    </main>
{% endblock %}
