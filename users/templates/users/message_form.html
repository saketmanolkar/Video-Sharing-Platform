{% extends 'main.html' %}
{% block content %}
    <!-- Main Section -->
    <main class="formPage my-xl">
        <div class="content-box">
            <div class="formWrapper">
                <a class="backButton" href="{% url 'profile' recipient.id %}">&lt;</a>
                <h3 class="formWrapper__subject" style="text-align: center; flex: 1;margin-top: -3rem;">Send a Message to {{ recipient.user.first_name }}</h3>

                <form class="form" method="POST">
                    {% csrf_token %}

                    {% if request.user.is_authenticated == False %}

                    <!-- Input:Text -->
                    <div class="form__field">
                        <label for="formInput#text">{{form.name.label}} </label>
                        {{ form.name }}
                    </div>

                    <!-- Input:Text -->
                    <div class="form__field">
                        <label for="formInput#text">{{form.email.label}} </label>
                        {{ form.email }}
                    </div>

                        
                    {% endif %}
                    
                    <!-- Input:Text -->
                    <div class="form__field">
                        <label for="formInput#text">{{form.subject.label}} </label>
                        {{ form.subject }}
                    </div>

                    <!-- Input:Text -->
                    <div class="form__field">
                        <label for="formInput#text">{{form.body.label}} </label>
                        {{ form.body }}
                    </div>

                
                    <input class="btn btn--sub btn--lg  my-md" type="submit" value="Submit" />
                </form>
            </div>
        </div>
    </main>
{% endblock content %}
