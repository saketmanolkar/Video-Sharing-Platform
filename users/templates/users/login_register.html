{% extends 'main.html' %}
{% load static %}

{% block content %}
{% if page == "register_page" %}

<h1>Register User</h1>
<form method="POST" action="{% url 'register-page' %}">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="submit" value="Register User">
</form>

{% else %}
    <div class="auth">
      <div class="card">
        <div class="auth__header text-center">
          <a href="/">
            <img src="{% static 'images/login_icon.svg' %}" alt="icon" />
          </a>
          <h3>Account Login</h3>
          <p>Hello Developer, Welcome Back!</p>
        </div>

        <form method="POST" action="{% url 'login-page' %}" class="form auth__form">
          {% csrf_token %}
          <!-- Input:Email -->
          <div class="form__field">
            <label for="formInput#text">Username: </label>
            <input
              class="input input--text"
              id="formInput#text"
              type="text"
              name="username"
              placeholder="Enter your username..."
            />
          </div>

          <!-- Input:Password -->
          <div class="form__field">
            <label for="formInput#password">Password: </label>
            <input
              class="input input--password"
              id="formInput#password"
              type="password"
              name="password"
              placeholder="••••••••"
            />
          </div>
          <div class="auth__actions">
            <input class="btn btn--sub btn--lg" type="submit" value="Log In" />
            <a href="forgetpassword.html">Forget Password?</a>
          </div>
        </form>
        <div class="auth__alternative">
          <p>Don’t have an Account?</p>
          <a href="{% url 'register-page' %}">Sign Up</a>
        </div>
      </div>
    </div>
{% endif %}
{% endblock %}
