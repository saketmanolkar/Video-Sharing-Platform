<style>
.alert-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 999;
    display: none;
}

.delete-popup {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 1000;
    background: var(--color-sub-lighter);
    padding: 2rem;
    border-radius: 0.7rem;
    box-shadow: 0 0 10px rgba(0,0,0,0.3);
    min-width: 300px;
    text-align: center;
    display: none;
}

.delete-popup__message {
    margin-bottom: 1.5rem;
    font-size: 1.6rem;
    color: var(--color-sub);
}

.delete-popup__message strong {
    color: var(--color-main);
    font-weight: 600;
}

.delete-popup__actions {
    display: flex;
    justify-content: center;
    gap: 1rem;
}

.delete-popup .btn {
    padding: 0.8rem 2rem;
    border-radius: 5px;
    font-size: 1.4rem;
    cursor: pointer;
    transition: all 0.3s ease;
}

.delete-popup .btn--sub {
    background-color: var(--color-main);
    color: white;
}

.delete-popup .btn--sub:hover {
    opacity: 0.9;
    transform: translateY(-2px);
}

#messageContainer {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 10000;
}

.alert {
    padding: 1rem 2rem;
    border-radius: 5px;
    margin-bottom: 1rem;
    animation: slideIn 0.3s ease-out;
}

.alert--success {
    background: var(--color-success);
    color: white;
}

.alert--error {
    background: var(--color-error);
    color: white;
}

@keyframes slideIn {
    from {
        transform: translateX(100%);
        opacity: 0;
    }
    to {
        transform: translateX(0);
        opacity: 1;
    }
}
</style>

<div class="alert-overlay">
    <div class="delete-popup">
        <p class="delete-popup__message">
            Are you sure you want to delete "<strong></strong>"?
        </p>
        <div class="delete-popup__actions">
            <form method="POST" style="display: inline;">
                {% csrf_token %}
                <input type="submit" value="Delete" class="btn btn--sub">
            </form>
            <button onclick="hideDeleteConfirmation()" class="btn">Cancel</button>
        </div>
    </div>
</div>

<script>
function showMessage(message, type = 'success') {
    const messageContainer = document.getElementById('messageContainer');
    if (!messageContainer) {
        const container = document.createElement('div');
        container.id = 'messageContainer';
        container.style.cssText = `
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
        `;
        document.body.appendChild(container);
    }

    const messageElement = document.createElement('div');
    messageElement.className = `alert alert--${type}`;
    messageElement.textContent = message;

    document.getElementById('messageContainer').appendChild(messageElement);

    setTimeout(() => {
        messageElement.remove();
        const container = document.getElementById('messageContainer');
        if (container && !container.hasChildNodes()) {
            container.remove();
        }
    }, 3000);
}

async function handleDeleteComment(e) {
    e.preventDefault();
    const popup = document.querySelector('.delete-popup');
    const reviewId = popup.dataset.commentId;
    
    try {
        const videoId = window.location.pathname.split('/').filter(Boolean).pop();
        const token = await AuthHandler.getToken();
        
        if (!token) {
            showMessage('Authentication required', 'error');
            return;
        }

        const response = await fetch(`/api/projects/${videoId}/reviews/${reviewId}/`, {
            method: 'DELETE',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            }
        });

        if (response.ok) {
            const row = document.querySelector(`tr[data-review-id="${reviewId}"]`);
            if (row) {
                row.remove();
            }
            showMessage('Comment deleted successfully!', 'success');
        } else {
            const error = await response.json();
            showMessage(error.error || 'Error deleting comment', 'error');
        }
    } catch (error) {
        console.error('Error:', error);
        showMessage('Error deleting comment', 'error');
    }
}

function showDeleteConfirmation(itemId, itemName, itemType) {
    const overlay = document.querySelector('.alert-overlay');
    const popup = document.querySelector('.delete-popup');
    const messageElement = popup.querySelector('.delete-popup__message strong');
    
    // Set the item details
    popup.dataset.commentId = itemId;
    messageElement.textContent = `${itemType}: "${itemName}"`;

    // Show both overlay and popup
    overlay.style.display = 'flex';
    popup.style.display = 'flex';

    // Handle form submission
    const form = popup.querySelector('form');
    if (form) {
        form.onsubmit = async (e) => {
            e.preventDefault();
            await handleDeleteComment(e);
            hideDeleteConfirmation();
        };
    }
}

function hideDeleteConfirmation() {
    document.querySelector('.alert-overlay').style.display = 'none';
    document.querySelector('.delete-popup').style.display = 'none';
}
</script>
