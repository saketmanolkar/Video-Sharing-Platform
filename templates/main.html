{% load static %}
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Icon -->
  <link rel="shortcut icon" href="{% static 'images/logo_icon.svg' %}" type="image/x-icon" />

   <!-- Custom CSS -->
  <link rel="stylesheet" href="{% static 'uikit/styles/uikit.css' %}" />
  <link rel="stylesheet" href="{% static 'styles/app.css' %}" />
  <link rel="stylesheet" href="{% static 'uikit/app.css' %}">

  <title>FilmsNation - Movies</title>

  <!-- External Libraries -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://vjs.zencdn.net/8.16.1/video-js.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/default.min.css">
  
</head>


<body>
    {% include 'navbar.html' %}
    {% if messages %}
    <div class="alert-wrapper">
        {% for message in messages %}
        <div class="alert alert--{{ message.tags }}">
            <p class="alert__message">{{ message }}</p>
            <button class="alert__close" onclick="this.parentElement.remove()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        {% endfor %}
    </div>
    {% endif %}
    {% block content %}

    {% endblock %}
    <!-- Video.js Script -->
    <script src="https://vjs.zencdn.net/8.16.1/video.min.js"></script>

    <!-- Highlight.js Script -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <!-- Mumble UI Script -->
    <script src="{% static 'uikit/app.js' %}"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const alertWrapper = document.querySelector('.alert-wrapper');
            if (alertWrapper) {
                const observer = new MutationObserver(function(mutations) {
                    if (alertWrapper.children.length === 0) {
                        alertWrapper.remove();
                    }
                });
                
                observer.observe(alertWrapper, { childList: true });
            }
        });
    </script>
</body>
</html>
