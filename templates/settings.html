{% extends 'main.html' %}

{% block content %}
<main class="checkered-background" style="min-height: 100vh; margin: 0; padding: 3rem 0;">
    <div class="settings-container">
        <div style="text-align: center; margin-bottom: 2rem;">
            <h2 style="font-size: 4.5rem; font-weight: 600; color: #2D2D2D; margin-bottom: -1rem; margin-top: -2rem;">SETTINGS</h2>
            <p style="font-size: 1.57rem; color: #666; margin-bottom: -3em;">Manage your account settings here.</p>
        </div>

        <div class="settings-layout">
            <!-- Left Column - Just the form, no extra containers -->
            <div class="settings-left">
                {% include 'password_change.html' with form=password_form %}
            </div>

            <!-- Right Column - for future settings -->
            <div class="settings-right">
                <!-- Other settings sections can go here -->
            </div>
        </div>
    </div>
</main>
<style>
    .settings-container {
        padding: 2rem;
        max-width: 1200px;
        margin: 0 auto;
    }

    .settings-layout {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 2rem;
        margin-top: 2rem;
    }

    @media (max-width: 768px) {
        .settings-layout {
            grid-template-columns: 1fr;
        }
    }
</style>
{% endblock %}
