{% load static %}


<header class="header">
    <div class="container container--narrow">
      <a href="/" class="header__logo">
        <img src="{% static 'images/logo1.svg' %}" alt="DevSearch Logo" />
      </a>
      <nav class="header__nav">
        <input type="checkbox" id="responsive-menu" />
        <label for="responsive-menu" class="toggle-menu">
          <span>Menu</span>
          <div class="toggle-menu__lines"></div>
        </label>
        <ul class="header__menu">
          <li class="header__menuItem"><a href="{% url 'projects-list'%}">Videos</a></li>
          <li class="header__menuItem"><a href="{% url 'blog-index'%}">Blogs</a></li>
          {% if user.is_authenticated %} 
          <li class="header__menuItem"><a href="{% url 'profile' user.profile.id %}">My Account</a></li>
          {% endif %}
          <li class="header__menuItem"><a href="{% url 'create-project'%}" >Upload Video</a></li>
          {% if not user.is_authenticated %}
          <li class="header__menuItem"><a href="{% url 'login-page'%}" >Login / Sign Up</a></li>
          {% else %}
          <li class="header__menuItem">
              <a href="{% url 'logout-user' %}" 
                 onclick="return handleLogout()" 
                 >Logout</a>
          </li>
          {% endif %}
        </ul>
      </nav>
    </div>
  </header>

<script>
function handleLogout() {
    if (typeof logoutUser === 'function') {
        logoutUser();
    } else {
        window.location.href = "{% url 'logout-user' %}";
    }
    return false;
}
</script>
