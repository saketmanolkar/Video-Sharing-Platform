{% load static %}


<header class="header">
    <div class="container container--narrow">
      <a href="/" class="header__logo">
        <img src="{% static 'images/logo1.svg' %}" alt="DevSearch Logo" />
      </a>
      <nav class="header__nav">
        <input type="checkbox" id="responsive-menu" />
        <label for="responsive-menu" class="toggle-menu">
          <span>Menu</span>
          <div class="toggle-menu__lines"></div>
        </label>
        <ul class="header__menu">
          <li class="header__menuItem"><a href="{% url 'projects'%}">Videos</a></li>
          <li class="header__menuItem"><a href="login.html">Login / Sign Up</a></li>
          <li class="header__menuItem"><a href="inbox.html">Inbox</a></li>
          {% if user.is_authenticated %}
            <li class="header__menuItem"><a href="{% url 'profile' user.profile.id %}">My Account</a></li>
          {% endif %}
          <li class="header__menuItem"><a href="{% url 'create-project'%}" class="btn btn--sub">Add a video</a></li>
        </ul>
      </nav>
    </div>
  </header>
