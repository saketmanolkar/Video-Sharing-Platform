version: '3.8'

services:
  web:
    build: .
    command: >
      bash -c "python manage.py migrate &&
               python manage.py collectstatic --noinput &&
               gunicorn testrun.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 300 --worker-tmp-dir /dev/shm"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=rediss://default:AVNS_VfAUOUeuEylqQuNwZJK@db-caching-nyc3-18707-do-user-18917001-0.k.db.ondigitalocean.com:25061
      - REDIS_HOST=db-caching-nyc3-18707-do-user-18917001-0.k.db.ondigitalocean.com
      - REDIS_SSL=true
      - REDIS_SSL_CERT_REQS=none
    restart: always
    shm_size: 512M

  celery:
    build: .
    command: >
      bash -c "python manage.py migrate &&
               python manage.py collectstatic --noinput &&
               cd /app && celery -A testrun worker --loglevel=INFO"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    environment:
      - REDIS_URL=rediss://default:AVNS_VfAUOUeuEylqQuNwZJK@db-caching-nyc3-18707-do-user-18917001-0.k.db.ondigitalocean.com:25061
      - REDIS_HOST=db-caching-nyc3-18707-do-user-18917001-0.k.db.ondigitalocean.com
      - REDIS_SSL=true
      - REDIS_SSL_CERT_REQS=none
    restart: always

volumes:
  static_volume:
  media_volume: